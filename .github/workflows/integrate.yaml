name: Subsequent Builds and Deployments

on:
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    # Record file state
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            terraform:
              - 'terraform/**'
  reposcan:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Run Trivy Repo Critical Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL'
      - name: Run Trivy Repo Comprehensive Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '0'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'HIGH,MEDIUM,LOW,UNKNOWN'
          skip-setup-trivy: true

  # Runs ONLY if backend/ folder changed
  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and load backend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: kronos-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kronos-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL'
      - name: Test backend container
        run: |
          # Create a user-defined network (once)
          docker network create kronos-net 2>/dev/null || true

          # Start Postgres on that network
          docker run -d --name kronos-pg --network kronos-net \
            -e POSTGRES_DB=kronos \
            -e POSTGRES_USER=app \
            -e POSTGRES_PASSWORD=dev-password \
            -p 5432:5432 \
            postgres:15-alpine
          
          sleep 5

          # Start backend on the same network; use container DNS name
          docker run -d --name backend-test --network kronos-net \
            -e DB_HOST=kronos-pg \
            -e DB_PASSWORD=dev-password \
            -p 5000:5000 \
            kronos-backend:${{ github.sha }}

          sleep 5

          echo "Checking Health endpoint"
          curl --fail http://localhost:5000/health || (docker logs backend-test && exit 1)

          echo "Checking API endpoint"
          curl --fail http://localhost:5000/world-clocks || (docker logs backend-test && exit 1)

          docker stop backend-test
          docker rm backend-test
      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            victorthegreat7/kronos-backend:${{ github.sha }}
            victorthegreat7/kronos-backend:latest
          cache-from: type=gha

  # Runs ONLY if frontend/ folder changed
  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and load frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          load: true
          tags: kronos-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kronos-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          scanners: 'vuln,secret,misconfig,license'
          severity: 'CRITICAL'
      - name: Test frontend container
        run: |
          docker run -d -p 8080:80 --name frontend-test kronos-frontend:${{ github.sha }}

          sleep 5

          echo "Checking Health endpoint"
          curl --fail http://localhost:8080/health || (docker logs frontend-test && exit 1)

          docker stop frontend-test
          docker rm frontend-test
      - name: Push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            victorthegreat7/kronos-frontend:${{ github.sha }}
            victorthegreat7/kronos-frontend:latest
          cache-from: type=gha

  # Runs ONLY if terraform/ folder changed
  modify-infra:
    needs: [changes, reposcan]
    if: ${{ needs.changes.outputs.terraform == 'true' && needs.reposcan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - name: Decode OCI Private Key
        run: |
          echo "OCI_CLI_KEY_CONTENT=$(printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d)" >> $GITHUB_ENV
      - name: Setup OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'iam region list'
      - name: Write OCI CLI config file
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          # The Terraform OCI provider authenticates via $HOME/.oci/config
          # (the run-oci-cli-command action uses OCI_CLI_* env vars instead).
          mkdir -p "$HOME/.oci"
          cat > "$HOME/.oci/config" <<EOF
          [DEFAULT]
          user=${OCI_USER}
          fingerprint=${OCI_FINGERPRINT}
          tenancy=${OCI_TENANCY}
          region=${OCI_REGION}
          key_file=$HOME/.oci/key.pem
          EOF
          printf '%s' "${OCI_PRIVATE_KEY}" | base64 -d > "$HOME/.oci/key.pem"
          chmod 600 "$HOME/.oci/config" "$HOME/.oci/key.pem"
      - name: Cache Terraform Plugin Dir
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-
      - name: Apply OCI infrastructure (network, OKE cluster, node pool)
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY }}
          TF_VAR_oci_compartment_ocid: ${{ secrets.OCI_COMPARTMENT }}
          TF_VAR_oci_region: ${{ secrets.OCI_REGION }}
        run: |
          set -e

          mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache
          echo "plugin_cache_dir = \"${{ github.workspace }}/.terraform.d/plugin-cache\"" > ~/.terraformrc

          terraform init
          terraform validate
          terraform apply -auto-approve
        working-directory: ./terraform/infra
      - name: Wait for OKE nodes to be ready
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/kubeconfig
        run: |
          set -e
          for i in $(seq 1 90); do
            if kubectl get nodes >/dev/null 2>&1; then
              TOTAL=$(kubectl get nodes --no-headers 2>/dev/null | wc -l | tr -d ' ')
              READY=$(kubectl get nodes --no-headers 2>/dev/null | awk '$2 == "Ready"' | wc -l | tr -d ' ')
              if [ -n "$TOTAL" ] && [ "$TOTAL" -ge 1 ] && [ "$READY" -eq "$TOTAL" ]; then
                echo "All $TOTAL nodes are ready:"
                kubectl get nodes -o wide
                exit 0
              fi
            fi
            echo "Waiting for nodes to become ready (attempt $i)..."
            sleep 20
          done
          echo "Nodes did not become ready in time."
          kubectl get nodes 2>&1 || true
          exit 1
      - name: Apply in-cluster resources (Helm/Kubernetes) with Terraform
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          set -e

          TF_VAR_cluster_name=$(cd infra && terraform output -raw cluster_name)
          export TF_VAR_cluster_name

          cat <<EOF > terraform.tfvars.json
          {
            "cloudflare_api_token": "${{ secrets.CLOUDFLARE_TOKEN }}",
            "cloudflare_zone_id": "${{ secrets.CLOUDFLARE_ZONE_ID }}",
            "datadog_api_key": "${{ secrets.DATADOG_API_KEY }}",
            "datadog_app_key": "${{ secrets.DATADOG_APP_KEY }}",
            "postgres_pass": "${{ secrets.POSTGRES_PASS }}",
            "redis_pass": "${{ secrets.REDIS_PASS }}"
          }
          EOF

          terraform init
          terraform validate
          terraform apply -auto-approve
        working-directory: ./terraform
      - name: Commit Terraform Lock Files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update terraform.lock.hcl"
          file_pattern: "terraform/.terraform.lock.hcl terraform/infra/.terraform.lock.hcl"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

  # Runs if either terraform/ did not change and backend/ changed
  update-oke-backend-images:
    needs: [reposcan, build-backend, modify-infra]
    if: ${{ always() && needs.reposcan.result == 'success' && needs.build-backend.result == 'success' && (needs.modify-infra.result == 'skipped' || needs.modify-infra.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - name: Decode OCI Private Key
        run: |
          echo "OCI_CLI_KEY_CONTENT=$(printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d)" >> $GITHUB_ENV
      - name: Setup OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'iam region list'
      - name: Cache Terraform Plugin Dir
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-
      - name: Generate OKE kubeconfig
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -e

          mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache
          echo "plugin_cache_dir = \"${{ github.workspace }}/.terraform.d/plugin-cache\"" > ~/.terraformrc

          terraform init
          CLUSTER_ID=$(terraform output -raw cluster_id)
          echo "Retrieved cluster id: ${CLUSTER_ID}"

          oci ce cluster create-kubeconfig \
            --cluster-id "${CLUSTER_ID}" \
            --file ${{ github.workspace }}/terraform/kubeconfig \
            --region "${OCI_REGION}" \
            --token-version 2.0.0

          KUBECONFIG=${{ github.workspace }}/terraform/kubeconfig kubectl cluster-info
        working-directory: ./terraform/infra
      - name: Update Image in OKE
        run: |
          kubectl set image deployment/kronos-backend backend=victorthegreat7/kronos-backend:latest -n kronos
          kubectl rollout restart deploy kronos-backend -n kronos

  # Runs if either terraform/ did not change and frontend/ changed
  update-oke-frontend-images:
    needs: [reposcan, build-frontend, modify-infra]
    if: ${{ always() && needs.reposcan.result == 'success' && needs.build-frontend.result == 'success' && (needs.modify-infra.result == 'skipped' || needs.modify-infra.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OCI_CLI_USER: ${{ secrets.OCI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_CLI_REGION: ${{ secrets.OCI_REGION }}
    steps:
      - name: Checkout current Github repository
        uses: actions/checkout@v6
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'
      - name: Decode OCI Private Key
        run: |
          echo "OCI_CLI_KEY_CONTENT=$(printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" | base64 -d)" >> $GITHUB_ENV
      - name: Setup OCI CLI
        uses: oracle-actions/run-oci-cli-command@v1.3.2
        with:
          command: 'iam region list'
      - name: Cache Terraform Plugin Dir
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.terraform.d/plugin-cache
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('terraform/.terraform.lock.hcl', 'terraform/infra/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-
      - name: Generate OKE kubeconfig
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          set -e

          mkdir -p ${{ github.workspace }}/.terraform.d/plugin-cache
          echo "plugin_cache_dir = \"${{ github.workspace }}/.terraform.d/plugin-cache\"" > ~/.terraformrc

          terraform init
          CLUSTER_ID=$(terraform output -raw cluster_id)
          echo "Retrieved cluster id: ${CLUSTER_ID}"

          oci ce cluster create-kubeconfig \
            --cluster-id "${CLUSTER_ID}" \
            --file ${{ github.workspace }}/terraform/kubeconfig \
            --region "${OCI_REGION}" \
            --token-version 2.0.0

          KUBECONFIG=${{ github.workspace }}/terraform/kubeconfig kubectl cluster-info
        working-directory: ./terraform/infra
      - name: Update Image in OKE
        run: |
          kubectl set image deployment/kronos-frontend frontend=victorthegreat7/kronos-frontend:latest -n kronos
          kubectl rollout restart deploy kronos-frontend -n kronos
